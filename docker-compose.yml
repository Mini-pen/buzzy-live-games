services:
  buzzy-live-games-web:
    build:
      context: .
      dockerfile: webserver/Dockerfile
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/buzzy-live-games}
    image: buzzy-live-games:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # * Reverse-proxy mount path. Must match APP_BASE_PATH / the Traefik rule below.
      BASE_PATH: ${APP_BASE_PATH:-/buzzy-live-games}
      # * Full public URL incl. the sub-path (QR codes, admin resume links).
      PUBLIC_URL: ${PUBLIC_URL:-https://games.from-beyond.fr/buzzy-live-games}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      GAMES_DIR: /app/games
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # --- HTTP: redirect to HTTPS ---
      - traefik.http.routers.buzzylive-http.rule=Host(`${GAMES_HOST:-games.from-beyond.fr}`) && PathPrefix(`${APP_BASE_PATH:-/buzzy-live-games}`)
      - traefik.http.routers.buzzylive-http.entrypoints=web
      - traefik.http.routers.buzzylive-http.middlewares=buzzylive-redirect-https
      - traefik.http.routers.buzzylive-http.service=buzzylive-svc
      # --- HTTPS: strip the sub-path prefix, then forward to the app ---
      - traefik.http.routers.buzzylive-https.rule=Host(`${GAMES_HOST:-games.from-beyond.fr}`) && PathPrefix(`${APP_BASE_PATH:-/buzzy-live-games}`)
      - traefik.http.routers.buzzylive-https.entrypoints=websecure
      - traefik.http.routers.buzzylive-https.tls=true
      - traefik.http.routers.buzzylive-https.tls.certresolver=letsencrypt
      - traefik.http.routers.buzzylive-https.middlewares=buzzylive-stripprefix
      - traefik.http.routers.buzzylive-https.service=buzzylive-svc
      # --- shared service + middlewares ---
      - traefik.http.services.buzzylive-svc.loadbalancer.server.port=3000
      - traefik.http.middlewares.buzzylive-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.buzzylive-redirect-https.redirectscheme.permanent=true
      - traefik.http.middlewares.buzzylive-stripprefix.stripprefix.prefixes=${APP_BASE_PATH:-/buzzy-live-games}

networks:
  dokploy-network:
    external: true
